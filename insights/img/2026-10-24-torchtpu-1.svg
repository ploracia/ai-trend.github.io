<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="PyTorch 코드가 TorchTPU 백엔드를 거쳐 구글 TPU에서 실행되는 흐름">
  <defs>
    <marker id="arrA" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <rect x="20" y="100" width="180" height="90" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="110" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1f">PyTorch 코드</text>
  <text x="110" y="162" text-anchor="middle" font-size="13" fill="#1b1b1f">모델과 학습 루프</text>
  <line x1="204" y1="145" x2="262" y2="145" stroke="#62626b" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="266" y="100" width="188" height="90" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
  <text x="360" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1f">TorchTPU</text>
  <text x="360" y="162" text-anchor="middle" font-size="13" fill="#1b1b1f">PyTorch 네이티브 백엔드</text>
  <line x1="458" y1="145" x2="516" y2="145" stroke="#62626b" stroke-width="2" marker-end="url(#arrA)"/>
  <rect x="520" y="100" width="180" height="90" rx="12" fill="#fbeae6" stroke="#c2412d" stroke-width="2"/>
  <text x="610" y="136" text-anchor="middle" font-size="17" font-weight="700" fill="#1b1b1f">Google TPU</text>
  <text x="610" y="162" text-anchor="middle" font-size="13" fill="#1b1b1f">구글의 AI 연산 칩</text>
  <text x="360" y="232" text-anchor="middle" font-size="14" fill="#1b1b1f">장치 이름만 tpu로 지정하면 나머지 코드는 그대로 쓰는 것이 목표</text>
  <text x="360" y="258" text-anchor="middle" font-size="13" fill="#62626b">이전 경로인 PyTorch/XLA는 TorchTPU로 대체되는 중</text>
</svg>
