<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 340" role="img" aria-label="일반 트랜스포머와 루프 트랜스포머 비교">
  <style>
    .t { font: 600 16px sans-serif; fill: #1b1b1f; }
    .s { font: 13px sans-serif; fill: #62626b; }
    .box { fill: #e8eefe; stroke: #2f5bea; stroke-width: 1.5; }
    .loop { fill: none; stroke: #1f8a5b; stroke-width: 2; stroke-dasharray: 5 4; }
    .arr { stroke: #62626b; stroke-width: 1.5; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .t { fill: #ececf0; } .s { fill: #9a9aa5; }
      .box { fill: #1f2640; stroke: #7c9cff; } .loop { stroke: #4cc38a; } .arr { stroke: #9a9aa5; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>

  <text class="t" x="20" y="30">일반 모델: 층 4개를 한 번씩 통과</text>
  <rect class="box" x="20" y="48" width="90" height="36" rx="8"/><text class="s" x="65" y="71" text-anchor="middle">층 1</text>
  <rect class="box" x="130" y="48" width="90" height="36" rx="8"/><text class="s" x="175" y="71" text-anchor="middle">층 2</text>
  <rect class="box" x="240" y="48" width="90" height="36" rx="8"/><text class="s" x="285" y="71" text-anchor="middle">층 3</text>
  <rect class="box" x="350" y="48" width="90" height="36" rx="8"/><text class="s" x="395" y="71" text-anchor="middle">층 4</text>
  <line class="arr" x1="110" y1="66" x2="128" y2="66"/><line class="arr" x1="220" y1="66" x2="238" y2="66"/><line class="arr" x1="330" y1="66" x2="348" y2="66"/>
  <text class="s" x="460" y="71">→ 층이 4개면 계산도 4단계</text>

  <text class="t" x="20" y="150">루프 모델: 같은 묶음을 여러 번 재사용</text>
  <rect class="box" x="20" y="168" width="90" height="36" rx="8"/><text class="s" x="65" y="191" text-anchor="middle">입력</text>
  <rect class="box" x="150" y="168" width="200" height="36" rx="8"/><text class="s" x="250" y="191" text-anchor="middle">가운데 층 묶음 (저장은 1번)</text>
  <rect class="box" x="400" y="168" width="90" height="36" rx="8"/><text class="s" x="445" y="191" text-anchor="middle">출력</text>
  <path class="loop" d="M150,168 C120,130 380,130 350,168"/>
  <text class="s" x="250" y="132" text-anchor="middle">같은 묶음을 3번 돈다</text>
  <line class="arr" x1="110" y1="186" x2="148" y2="186"/><line class="arr" x1="350" y1="186" x2="398" y2="186"/>
  <text class="s" x="20" y="250">메모리에는 묶음 하나만 올려 두고, 계산 단계는 늘린다.</text>
  <text class="s" x="20" y="272">비유: 같은 요리사가 같은 조리대에서 세 번 재료를 손질하는 방식</text>
  <text class="s" x="20" y="310">그림은 출처 설명을 바탕으로 직접 다시 그림</text>
</svg>
