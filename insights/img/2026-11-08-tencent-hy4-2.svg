<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" role="img" aria-labelledby="t2 d2">
  <title id="t2">Hy4 요청 처리 흐름</title>
  <desc id="d2">입력이 들어가 전문가 일부만 활성화되는 MoE 구조를 거쳐 출력되고, 도구 결과가 다시 입력으로 돌아가는 에이전트 루프</desc>
  <rect x="0" y="0" width="640" height="320" rx="14" fill="#f7f6f2"/>
  <text x="32" y="44" font-family="Pretendard, sans-serif" font-size="18" font-weight="700" fill="#1b1b1f">요청 한 번이 처리되는 과정</text>
  <text x="32" y="66" font-family="Pretendard, sans-serif" font-size="13" fill="#62626b">출처 글을 바탕으로 다시 그림</text>
  <rect x="30" y="110" width="150" height="110" rx="12" fill="#ffffff" stroke="#e3e1da" stroke-width="2"/>
  <text x="105" y="145" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">입력</text>
  <text x="105" y="170" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">텍스트 · 이미지</text>
  <text x="105" y="190" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">(1M 토큰 창)</text>
  <rect x="245" y="100" width="170" height="130" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="330" y="138" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">MoE 라우팅</text>
  <text x="330" y="163" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">전문가 일부만 호출</text>
  <text x="330" y="186" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">프리뷰 기준</text>
  <text x="330" y="206" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">770B 중 49B 활성</text>
  <rect x="470" y="110" width="150" height="110" rx="12" fill="#ffffff" stroke="#e3e1da" stroke-width="2"/>
  <text x="545" y="145" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">출력</text>
  <text x="545" y="170" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">답변 또는</text>
  <text x="545" y="190" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1b1b1f">도구 호출</text>
  <line x1="180" y1="165" x2="245" y2="165" stroke="#62626b" stroke-width="2.5"/>
  <polygon points="245,165 236,160 236,170" fill="#62626b"/>
  <line x1="415" y1="165" x2="470" y2="165" stroke="#62626b" stroke-width="2.5"/>
  <polygon points="470,165 461,160 461,170" fill="#62626b"/>
  <path d="M545 220 L545 270 L105 270 L105 222" fill="none" stroke="#1f8a5b" stroke-width="2.5" stroke-dasharray="6 5"/>
  <polygon points="105,222 100,231 110,231" fill="#1f8a5b"/>
  <text x="325" y="294" text-anchor="middle" font-family="Pretendard, sans-serif" font-size="13" fill="#1f8a5b">에이전트 루프: 도구 결과를 다시 입력으로 넣고 반복</text>
</svg>
