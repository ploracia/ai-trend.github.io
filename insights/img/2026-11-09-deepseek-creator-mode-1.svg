<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="Creator Mode로 플러그인을 만드는 네 단계 흐름">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <rect width="760" height="260" fill="#f7f6f2" rx="12"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1b1f" font-family="sans-serif">Creator Mode로 플러그인 만들기 흐름</text>

  <g font-family="sans-serif" font-size="14" fill="#1b1b1f">
    <rect x="20" y="70" width="160" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
    <text x="100" y="105" text-anchor="middle" font-weight="700">1. 프롬프트</text>
    <text x="100" y="128" text-anchor="middle">공개된 예시</text>
    <text x="100" y="146" text-anchor="middle">문장을 복사</text>

    <rect x="200" y="70" width="160" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
    <text x="280" y="105" text-anchor="middle" font-weight="700">2. Harness 열기</text>
    <text x="280" y="128" text-anchor="middle">DeepSeek Harness</text>
    <text x="280" y="146" text-anchor="middle">앱에서 붙여넣기</text>

    <rect x="380" y="70" width="160" height="110" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
    <text x="460" y="105" text-anchor="middle" font-weight="700">3. Creator Mode</text>
    <text x="460" y="128" text-anchor="middle">말로 요구 사항 설명</text>
    <text x="460" y="146" text-anchor="middle">여러 번 다듬기 가능</text>

    <rect x="560" y="70" width="180" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
    <text x="650" y="105" text-anchor="middle" font-weight="700">4. 플러그인 완성</text>
    <text x="650" y="128" text-anchor="middle">설치해서 사용</text>
    <text x="650" y="146" text-anchor="middle">결과는 사람이 확인</text>
  </g>

  <g stroke="#62626b" stroke-width="2" fill="none" marker-end="url(#arr)">
    <line x1="182" y1="125" x2="196" y2="125"/>
    <line x1="362" y1="125" x2="376" y2="125"/>
    <line x1="542" y1="125" x2="556" y2="125"/>
  </g>

  <text x="380" y="222" text-anchor="middle" font-size="13" fill="#62626b" font-family="sans-serif">기사에 따르면 일곱 개의 시연 프롬프트가 공개되었고, 일부 플러그인은 여러 차례 대화로 다듬어졌다</text>
</svg>
