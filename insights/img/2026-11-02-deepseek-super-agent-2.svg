<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 330" role="img" aria-labelledby="t2 d2">
  <title id="t2">Super-Agent 작업 흐름</title>
  <desc id="d2">허용된 사람의 요청이 작업 항목이 되고, 별도 세션과 폴더에서 작업한 뒤 원래 대화에 결과를 남기며, 사람은 웹 패널에서 확인하는 흐름도</desc>
  <defs>
    <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <rect x="20" y="40" width="130" height="80" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="85" y="72" font-size="14" font-weight="700" fill="#1b1b1f">허용된 사람</text>
    <text x="85" y="92" font-size="12" fill="#1b1b1f">요청을 남김</text>
    <line x1="150" y1="80" x2="180" y2="80" stroke="#62626b" stroke-width="1.5" marker-end="url(#arr2)"/>

    <rect x="180" y="40" width="130" height="80" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="245" y="72" font-size="14" font-weight="700" fill="#1b1b1f">작업 항목 생성</text>
    <text x="245" y="92" font-size="12" fill="#1b1b1f">내부 목록에 등록</text>
    <line x1="310" y1="80" x2="340" y2="80" stroke="#62626b" stroke-width="1.5" marker-end="url(#arr2)"/>

    <rect x="340" y="40" width="130" height="80" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="405" y="72" font-size="14" font-weight="700" fill="#1b1b1f">별도 세션에서 작업</text>
    <text x="405" y="92" font-size="12" fill="#1b1b1f">전용 작업 폴더</text>
    <line x1="470" y1="80" x2="500" y2="80" stroke="#62626b" stroke-width="1.5" marker-end="url(#arr2)"/>

    <rect x="500" y="40" width="240" height="80" rx="12" fill="#2f5bea"/>
    <text x="620" y="72" font-size="14" font-weight="700" fill="#ffffff">원래 대화에 결과 답변</text>
    <text x="620" y="92" font-size="12" fill="#ffffff">예: 풀 리퀘스트 링크</text>

    <rect x="180" y="175" width="400" height="80" rx="12" fill="#f2f1ec" stroke="#62626b" stroke-width="1.2"/>
    <text x="380" y="205" font-size="14" font-weight="700" fill="#1b1b1f">웹 패널에서 사람이 확인</text>
    <text x="380" y="226" font-size="12" fill="#1b1b1f">사람의 판단이 필요한 항목이 모여 보임</text>
    <line x1="620" y1="120" x2="620" y2="150" stroke="#62626b" stroke-width="1.5"/>
    <line x1="620" y1="150" x2="580" y2="215" stroke="#62626b" stroke-width="1.5" marker-end="url(#arr2)"/>

    <text x="380" y="292" font-size="12.5" fill="#62626b">원본 README 기준: 대상은 한 개의 GitHub 저장소, 선택 사항으로 Feishu 연결</text>
  </g>
</svg>
