<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" role="img" aria-label="Qwen3.8-27B를 내 컴퓨터에서 실행하는 세 단계 흐름도">
  <rect width="640" height="300" rx="14" fill="#f4f6fb"/>
  <text x="32" y="42" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#1b1b1f">내 컴퓨터에서 돌리는 흐름</text>

  <rect x="32" y="82" width="170" height="110" rx="12" fill="#ffffff" stroke="#2f5bea" stroke-width="2"/>
  <text x="117" y="118" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">1. 모델 받기</text>
  <text x="117" y="144" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">GGUF 압축 파일</text>
  <text x="117" y="164" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">(Hugging Face)</text>

  <rect x="235" y="82" width="170" height="110" rx="12" fill="#ffffff" stroke="#2f5bea" stroke-width="2"/>
  <text x="320" y="118" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">2. 실행 도구</text>
  <text x="320" y="144" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">llama.cpp 또는</text>
  <text x="320" y="164" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">LM Studio</text>

  <rect x="438" y="82" width="170" height="110" rx="12" fill="#ffffff" stroke="#1f8a5b" stroke-width="2"/>
  <text x="523" y="118" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="15" font-weight="700" fill="#1b1b1f">3. 질문하기</text>
  <text x="523" y="144" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">터미널 대화 또는</text>
  <text x="523" y="164" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="12.5" fill="#4a4a55">로컬 API 서버</text>

  <line x1="204" y1="137" x2="229" y2="137" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arr)"/>
  <line x1="407" y1="137" x2="432" y2="137" stroke="#1b1b1f" stroke-width="2" marker-end="url(#arr)"/>
  <defs><marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1b1b1f"/></marker></defs>

  <rect x="32" y="222" width="576" height="52" rx="10" fill="#fbeae6"/>
  <text x="320" y="253" text-anchor="middle" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13.5" fill="#1b1b1f">4비트 기준 메모리 16GB 이상이 필요. 부족하면 더 작은 압축 파일을 고른다.</text>
</svg>
