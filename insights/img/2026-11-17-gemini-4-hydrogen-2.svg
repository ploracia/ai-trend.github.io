<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="입력, 생각 깊이 선택, 출력으로 이어지는 흐름">
  <rect x="0" y="0" width="720" height="260" fill="#ffffff"/>
  <text x="360" y="32" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b1f">요청 한 번이 답이 되기까지</text>
  <rect x="20" y="70" width="180" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="110" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a9e">1. 입력</text>
  <text x="110" y="124" text-anchor="middle" font-size="12" fill="#1d3a9e">텍스트·PDF·표·차트</text>
  <text x="110" y="144" text-anchor="middle" font-size="12" fill="#1d3a9e">음성·영상 (최대 100만 토큰)</text>
  <rect x="270" y="70" width="180" height="110" rx="12" fill="#fff6e0" stroke="#b07a10" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#6b4a06">2. 생각 깊이 선택</text>
  <text x="360" y="124" text-anchor="middle" font-size="12" fill="#6b4a06">low · medium</text>
  <text x="360" y="144" text-anchor="middle" font-size="12" fill="#6b4a06">high(기본) · xhigh</text>
  <rect x="520" y="70" width="180" height="110" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
  <text x="610" y="100" text-anchor="middle" font-size="15" font-weight="700" fill="#14513a">3. 출력</text>
  <text x="610" y="124" text-anchor="middle" font-size="12" fill="#14513a">도구 호출 결과</text>
  <text x="610" y="144" text-anchor="middle" font-size="12" fill="#14513a">근거 붙인 보고서</text>
  <path d="M205 125 L262 125" stroke="#62626b" stroke-width="2" marker-end="url(#a)"/>
  <path d="M455 125 L512 125" stroke="#62626b" stroke-width="2" marker-end="url(#a)"/>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#62626b"/></marker></defs>
  <text x="360" y="222" text-anchor="middle" font-size="13" fill="#444450">깊이를 높이면 정확도는 오르지만 시간과 비용이 늘어납니다</text>
</svg>
