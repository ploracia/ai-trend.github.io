<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" role="img" aria-label="최상위 모델과 빠른 모델 사이의 Hydrogen 위치">
  <rect x="0" y="0" width="720" height="320" fill="#ffffff"/>
  <text x="360" y="36" text-anchor="middle" font-size="18" font-weight="700" fill="#1b1b1f">모델 고르기: 품질과 속도·가격의 균형</text>
  <line x1="80" y1="250" x2="640" y2="250" stroke="#62626b" stroke-width="2"/>
  <line x1="80" y1="250" x2="80" y2="70" stroke="#62626b" stroke-width="2"/>
  <text x="360" y="284" text-anchor="middle" font-size="14" fill="#444450">빠르고 싼 쪽  ←→  깊게 생각하고 비싼 쪽</text>
  <text x="48" y="160" text-anchor="middle" font-size="14" fill="#444450" transform="rotate(-90 48 160)">답의 깊이</text>
  <rect x="110" y="170" width="170" height="60" rx="10" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
  <text x="195" y="195" text-anchor="middle" font-size="14" font-weight="700" fill="#14513a">Gemini 3.8 Flash</text>
  <text x="195" y="216" text-anchor="middle" font-size="12" fill="#14513a">이전 빠른 모델</text>
  <rect x="330" y="110" width="200" height="72" rx="10" fill="#e8eefe" stroke="#2f5bea" stroke-width="3"/>
  <text x="430" y="138" text-anchor="middle" font-size="15" font-weight="700" fill="#1d3a9e">Gemini 4 Hydrogen</text>
  <text x="430" y="160" text-anchor="middle" font-size="12" fill="#1d3a9e">빠름 + 긴 입력 + 생각 깊이 조절</text>
  <rect x="500" y="60" width="150" height="50" rx="10" fill="#fbeae6" stroke="#c2412d" stroke-width="2"/>
  <text x="575" y="90" text-anchor="middle" font-size="14" font-weight="700" fill="#7a2a1b">최상위 모델</text>
  <path d="M300 200 Q 360 180 410 150" fill="none" stroke="#2f5bea" stroke-width="2" stroke-dasharray="6 5"/>
  <text x="360" y="186" text-anchor="middle" font-size="12" fill="#2f5bea">Flash 대체</text>
</svg>
