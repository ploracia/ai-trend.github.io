<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 350" role="img" aria-labelledby="t1 d1">
  <title id="t1">LFM3 모델 가족 구조</title>
  <desc id="d1">하나의 기반 모델에서 이미지, 음성, 전체 입력 모델과 판단 특화 모델이 파생되는 구조도</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <g font-family="Pretendard, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif" text-anchor="middle">
    <!-- 기반 모델 -->
    <rect x="250" y="20" width="260" height="60" rx="12" fill="#2f5bea"/>
    <text x="380" y="46" font-size="16" font-weight="700" fill="#ffffff">LFM3-1.7B-Base</text>
    <text x="380" y="66" font-size="12.5" fill="#ffffff">뼈대 모델 · 22T 토큰 사전 학습</text>

    <!-- 연결선: 기반 -> 2행 -->
    <g stroke="#62626b" stroke-width="1.5" fill="none" marker-end="url(#arr)">
      <path d="M380,80 C380,105 110,100 110,130"/>
      <path d="M380,80 C380,105 290,100 290,130"/>
      <path d="M380,80 C380,105 470,100 470,130"/>
      <path d="M380,80 C380,105 650,100 650,130"/>
      <path d="M290,200 L290,240"/>
      <path d="M650,200 L650,240"/>
    </g>

    <!-- 2행: 입력 형태별 모델 -->
    <rect x="30" y="130" width="160" height="70" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="110" y="158" font-size="15" font-weight="700" fill="#1b1b1f">LFM3-1.7B</text>
    <text x="110" y="180" font-size="12.5" fill="#1b1b1f">텍스트 전용</text>

    <rect x="210" y="130" width="160" height="70" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="290" y="158" font-size="15" font-weight="700" fill="#1b1b1f">LFM3-VL-2B</text>
    <text x="290" y="180" font-size="12.5" fill="#1b1b1f">텍스트 + 이미지·영상</text>

    <rect x="390" y="130" width="160" height="70" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="470" y="158" font-size="15" font-weight="700" fill="#1b1b1f">LFM3-Audio-2B</text>
    <text x="470" y="180" font-size="12.5" fill="#1b1b1f">텍스트 + 음성 입출력</text>

    <rect x="570" y="130" width="160" height="70" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="650" y="158" font-size="15" font-weight="700" fill="#1b1b1f">LFM3-Omni-2B</text>
    <text x="650" y="180" font-size="12.5" fill="#1b1b1f">이미지·영상·음성 모두</text>

    <!-- 3행: 판단 특화 모델 -->
    <rect x="210" y="240" width="160" height="70" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="290" y="268" font-size="15" font-weight="700" fill="#1b1b1f">d1-2B</text>
    <text x="290" y="290" font-size="12.5" fill="#1b1b1f">VL 기반 · 판단 특화</text>

    <rect x="570" y="240" width="160" height="70" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="650" y="268" font-size="15" font-weight="700" fill="#1b1b1f">d1-Omni-2B</text>
    <text x="650" y="290" font-size="12.5" fill="#1b1b1f">Omni 기반 · 판단 특화</text>

    <text x="380" y="338" font-size="12.5" fill="#62626b">화살표는 파생 관계 · 모두 약 2B급 · 파란 상자 아래 두 개는 판단(d1) 계열</text>
  </g>
</svg>
