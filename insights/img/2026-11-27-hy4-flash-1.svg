<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="t1 d1">
  <title id="t1">Hy4 flash의 전문가 블록 개념도</title>
  <desc id="d1">전체 블록 중 일부만 파란색으로 켜져 있고, 토큰 하나가 들어올 때 그 블록만 사용하는 모습</desc>
  <rect x="0" y="0" width="720" height="360" rx="14" fill="#ffffff" stroke="#e3e1da"/>
  <text x="360" y="40" text-anchor="middle" font-size="20" font-weight="700" fill="#1b1b1f">전체 약 224B 중 토큰마다 약 12B만 사용 (설명용 그림)</text>
  <text x="360" y="64" text-anchor="middle" font-size="14" fill="#62626b">칸 하나가 전문가 블록 하나입니다. 실제 블록 수와 같지 않습니다.</text>
  <!-- grid 8 cols x 6 rows; active cells: 6 -->
  <g stroke="#c9ccd4" stroke-width="1">
    <rect x="120" y="92" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="192" y="92" width="64" height="40" rx="6" fill="#2f5bea"/>
    <rect x="264" y="92" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="336" y="92" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="408" y="92" width="64" height="40" rx="6" fill="#2f5bea"/>
    <rect x="480" y="92" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="552" y="92" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="120" y="144" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="192" y="144" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="264" y="144" width="64" height="40" rx="6" fill="#2f5bea"/>
    <rect x="336" y="144" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="408" y="144" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="480" y="144" width="64" height="40" rx="6" fill="#2f5bea"/>
    <rect x="552" y="144" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="120" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="192" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="264" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="336" y="196" width="64" height="40" rx="6" fill="#2f5bea"/>
    <rect x="408" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="480" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
    <rect x="552" y="196" width="64" height="40" rx="6" fill="#f1f2f5"/>
  </g>
  <text x="360" y="270" text-anchor="middle" font-size="15" fill="#1b1b1f">입력 토큰 1개 → 라우터가 파란 블록 몇 개만 고름</text>
  <text x="360" y="296" text-anchor="middle" font-size="14" fill="#62626b">나머지 블록은 이 토큰 계산에 참여하지 않음 → 계산량 절약</text>
  <text x="360" y="330" text-anchor="middle" font-size="13" fill="#62626b">출처 글과 공식 모델 카드를 바탕으로 다시 그림</text>
</svg>
