<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 300" role="img" aria-label="Gemini 4 Argon의 핵심 숫자를 카드 네 장으로 보여 주는 한눈에 보기 그림">
  <rect x="0" y="0" width="680" height="300" rx="14" fill="#f4f6fb"/>
  <text x="340" y="34" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700" fill="#1b1b1f">Gemini 4 Argon 핵심 숫자 네 가지</text>
  <rect x="30" y="60" width="150" height="210" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="105" y="92" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#1b1b1f">모델 이름</text>
  <text x="105" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="13" font-weight="700" fill="#1b1b1f">gemini-4-argon</text>
  <text x="105" y="160" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">API 호출 때 적는</text>
  <text x="105" y="178" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">식별 문자열</text>
  <rect x="200" y="60" width="150" height="210" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
  <text x="275" y="92" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#1b1b1f">한 번에 볼 수 있는 양</text>
  <text x="275" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="15" font-weight="700" fill="#1b1b1f">1,048,576</text>
  <text x="275" y="150" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">토큰 (입력·생각·출력 합계)</text>
  <text x="275" y="190" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">책상 한 개에 올릴 수 있는</text>
  <text x="275" y="208" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">종이 묶음의 최대 두께</text>
  <rect x="370" y="60" width="150" height="210" rx="12" fill="#fff4e0" stroke="#b7791f" stroke-width="2"/>
  <text x="445" y="92" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#1b1b1f">입력 가격 (100만 토큰)</text>
  <text x="445" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1b1b1f">$2 → $4</text>
  <text x="445" y="160" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">11월 30일까지 $2</text>
  <text x="445" y="178" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">12월 1일부터 $4 (보도 기준)</text>
  <rect x="540" y="60" width="120" height="210" rx="12" fill="#fbeae6" stroke="#c2412d" stroke-width="2"/>
  <text x="600" y="92" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#1b1b1f">출력 가격</text>
  <text x="600" y="128" text-anchor="middle" font-family="Consolas, monospace" font-size="16" font-weight="700" fill="#1b1b1f">$10 → $20</text>
  <text x="600" y="160" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">100만 토큰당</text>
  <text x="600" y="178" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="12" fill="#444">생각 토큰 포함</text>
  <text x="340" y="292" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="11" fill="#555">수치는 Google 공식 페이지가 아니라 2차 보도 여러 곳을 맞춰 본 값입니다</text>
</svg>
