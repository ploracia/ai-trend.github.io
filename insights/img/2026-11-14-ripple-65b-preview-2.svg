<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="모델 내려받기부터 코딩 에이전트 연결까지의 흐름">
  <style>text{font-family:Pretendard,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}</style>
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <!-- step 1 -->
  <rect x="20" y="70" width="150" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="95" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1b1f">1. 받기</text>
  <text x="95" y="126" font-size="13" text-anchor="middle" fill="#1b1b1f">모델 파일</text>
  <text x="95" y="146" font-size="13" text-anchor="middle" fill="#1b1b1f">(가중치)</text>
  <line x1="172" y1="125" x2="200" y2="125" stroke="#62626b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 2 -->
  <rect x="202" y="70" width="150" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="277" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1b1f">2. 실행</text>
  <text x="277" y="126" font-size="13" text-anchor="middle" fill="#1b1b1f">Ollama, vLLM 등</text>
  <text x="277" y="146" font-size="13" text-anchor="middle" fill="#1b1b1f">로컬 서버</text>
  <line x1="354" y1="125" x2="382" y2="125" stroke="#62626b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 3 -->
  <rect x="384" y="70" width="150" height="110" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="459" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#1b1b1f">3. 연결</text>
  <text x="459" y="126" font-size="13" text-anchor="middle" fill="#1b1b1f">코딩 에이전트가</text>
  <text x="459" y="146" font-size="13" text-anchor="middle" fill="#1b1b1f">이 서버를 호출</text>
  <line x1="536" y1="125" x2="564" y2="125" stroke="#62626b" stroke-width="2" marker-end="url(#arr)"/>
  <!-- step 4 -->
  <rect x="566" y="70" width="134" height="110" rx="12" fill="#2f5bea"/>
  <text x="633" y="102" font-size="14" font-weight="700" text-anchor="middle" fill="#ffffff">4. 확인</text>
  <text x="633" y="126" font-size="13" text-anchor="middle" fill="#ffffff">코드 수정 결과를</text>
  <text x="633" y="146" font-size="13" text-anchor="middle" fill="#ffffff">직접 검토</text>
  <text x="360" y="222" font-size="13" text-anchor="middle" fill="#4a4a52">세 단계 모두 공식 문서의 명령을 따라야 합니다. 이 글은 실행 명령을 검증하지 못했습니다.</text>
</svg>
