<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 260" role="img" aria-label="스킬을 단계적으로 불러오는 흐름도">
  <defs><marker id="a2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f5bea"/></marker></defs>
  <rect x="0" y="0" width="680" height="260" rx="14" fill="#f4f6fb"/>
  <text x="340" y="32" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="16" font-weight="700" fill="#1b1b1f">스킬은 필요한 만큼만 불러온다</text>
  <rect x="30" y="60" width="180" height="150" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="120" y="88" text-anchor="middle" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif" font-size="14" font-weight="700" fill="#1b1b1f">1단계 · 시작할 때</text>
