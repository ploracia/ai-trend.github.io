<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 300" role="img" aria-label="TorchTPU의 두 가지 실행 경로: 즉시 실행 모드와 torch.compile 컴파일 경로">
  <defs>
    <marker id="arrB" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <text x="20" y="30" font-size="15" font-weight="700" fill="#1b1b1f">① 즉시 실행(Eager): 코드 한 줄씩 바로 실행</text>
  <rect x="20" y="42" width="210" height="60" rx="10" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="125" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1f">Debug 모드</text>
  <text x="125" y="89" text-anchor="middle" font-size="12" fill="#1b1b1f">한 번에 하나씩, 오류 찾기 쉬움</text>
  <rect x="265" y="42" width="210" height="60" rx="10" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="370" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1f">Strict 모드</text>
  <text x="370" y="89" text-anchor="middle" font-size="12" fill="#1b1b1f">기본값, PyTorch 동작과 비슷</text>
  <rect x="510" y="42" width="210" height="60" rx="10" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
  <text x="615" y="68" text-anchor="middle" font-size="14" font-weight="700" fill="#1b1b1f">Fused 모드</text>
  <text x="615" y="89" text-anchor="middle" font-size="12" fill="#1b1b1f">연산을 묶어 빠르게 (자체 보고 기준)</text>
  <text x="20" y="150" font-size="15" font-weight="700" fill="#1b1b1f">② torch.compile: 미리 그래프로 만들어 컴파일</text>
  <rect x="20" y="172" width="150" height="62" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="2"/>
  <text x="95" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1f">Dynamo</text>
  <text x="95" y="218" text-anchor="middle" font-size="12" fill="#1b1b1f">연산 그래프 캡처</text>
  <line x1="174" y1="203" x2="194" y2="203" stroke="#62626b" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="198" y="172" width="150" height="62" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="2"/>
  <text x="273" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1f">StableHLO</text>
  <text x="273" y="218" text-anchor="middle" font-size="12" fill="#1b1b1f">공용 중간 표현</text>
  <line x1="352" y1="203" x2="372" y2="203" stroke="#62626b" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="376" y="172" width="150" height="62" rx="10" fill="#fff6e0" stroke="#b7791f" stroke-width="2"/>
  <text x="451" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1f">XLA</text>
  <text x="451" y="218" text-anchor="middle" font-size="12" fill="#1b1b1f">TPU용 컴파일러</text>
  <line x1="530" y1="203" x2="550" y2="203" stroke="#62626b" stroke-width="2" marker-end="url(#arrB)"/>
  <rect x="554" y="172" width="166" height="62" rx="10" fill="#fbeae6" stroke="#c2412d" stroke-width="2"/>
  <text x="637" y="198" text-anchor="middle" font-size="13" font-weight="700" fill="#1b1b1f">TPU 실행</text>
  <text x="637" y="218" text-anchor="middle" font-size="12" fill="#1b1b1f">컴파일 결과는 캐시에 저장</text>
  <text x="20" y="272" font-size="13" fill="#62626b">두 경로 모두 같은 캐시를 공유한다고 블로그는 설명합니다.</text>
</svg>
