<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" role="img" aria-label="코딩 모델이 요청을 받아 계획하고 파일을 고친 뒤 개발자가 검토하는 흐름도">
  <defs>
    <marker id="ar2" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <rect x="20" y="90" width="150" height="90" rx="12" fill="#2f5bea"/>
  <text x="95" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">1. 요청 전달</text>
  <text x="95" y="151" text-anchor="middle" font-size="12" fill="#ffffff">코드와 질문을 함께</text>
  <line x1="172" y1="135" x2="206" y2="135" stroke="#62626b" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="210" y="90" width="150" height="90" rx="12" fill="#7c3aed"/>
  <text x="285" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">2. 계획 세우기</text>
  <text x="285" y="151" text-anchor="middle" font-size="12" fill="#ffffff">필요한 파일을 찾음</text>
  <line x1="362" y1="135" x2="396" y2="135" stroke="#62626b" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="400" y="90" width="150" height="90" rx="12" fill="#b45309"/>
  <text x="475" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">3. 수정·실행</text>
  <text x="475" y="151" text-anchor="middle" font-size="12" fill="#ffffff">파일 편집, 명령 실행</text>
  <line x1="552" y1="135" x2="586" y2="135" stroke="#62626b" stroke-width="2" marker-end="url(#ar2)"/>
  <rect x="590" y="90" width="150" height="90" rx="12" fill="#1f8a5b"/>
  <text x="665" y="127" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">4. 사람이 검토</text>
  <text x="665" y="151" text-anchor="middle" font-size="12" fill="#ffffff">변경 내용을 확인·승인</text>
  <rect x="20" y="20" width="720" height="34" rx="8" fill="#2f5bea" fill-opacity="0.85"/>
  <text x="380" y="42" text-anchor="middle" font-size="13" fill="#ffffff">최종 판단은 개발자가 하는 반복 구조</text>
  <rect x="20" y="206" width="720" height="34" rx="8" fill="#62626b"/>
  <text x="380" y="228" text-anchor="middle" font-size="13" fill="#ffffff">1단계와 4단계 사이를 여러 번 오가며 작업이 끝난다</text>
</svg>
