<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-label="Qwen3.8-27B를 양자화 수준별로 돌릴 때 필요한 메모리 막대 그래프">
  <rect width="640" height="360" rx="14" fill="#f4f6fb"/>
  <text x="32" y="44" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="18" font-weight="700" fill="#1b1b1f">Qwen3.8-27B, 압축 수준별 필요 메모리(대략)</text>
  <text x="32" y="68" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#4a4a55">숫자가 작을수록 적은 메모리로 돌아가지만 답변 품질은 조금씩 떨어질 수 있음</text>

  <text x="32" y="112" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#1b1b1f">2비트</text>
  <rect x="150" y="96" width="82" height="24" rx="6" fill="#2f5bea"/>
  <text x="242" y="113" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#1b1b1f">9~11GB</text>

  <text x="32" y="162" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#1b1b1f">4비트</text>
  <rect x="150" y="146" width="142" height="24" rx="6" fill="#2f5bea"/>
  <text x="302" y="163" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#1b1b1f">16~19GB  ← 입문자 추천 구간</text>

  <text x="32" y="212" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#1b1b1f">6비트</text>
  <rect x="150" y="196" width="195" height="24" rx="6" fill="#7c9cff"/>
  <text x="355" y="213" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#1b1b1f">23~26GB</text>

  <text x="32" y="262" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#1b1b1f">8비트</text>
  <rect x="150" y="246" width="233" height="24" rx="6" fill="#9aa6c9"/>
  <text x="393" y="263" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#1b1b1f">31GB</text>

  <text x="32" y="312" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="14" fill="#1b1b1f">원본(BF16)</text>
  <rect x="150" y="296" width="420" height="24" rx="6" fill="#c2412d"/>
  <text x="580" y="313" text-anchor="end" font-family="Pretendard, Malgun Gothic, sans-serif" font-size="13" fill="#ffffff">56GB</text>
</svg>
