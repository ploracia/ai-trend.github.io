<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" role="img" aria-label="MoE 모델에서 토큰이 라우터를 거쳐 일부 전문가만 통과하는 구조">
  <rect width="720" height="300" fill="#f7f6f2"/>
  <text x="360" y="34" text-anchor="middle" font-family="sans-serif" font-size="18" font-weight="700" fill="#1b1b1f">MoE 구조: 전체는 크지만 한 번에 일부만 쓴다</text>
  <rect x="30" y="120" width="120" height="60" rx="10" fill="#ffffff" stroke="#62626b" stroke-width="2"/>
  <text x="90" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1b1b1f">입력 토큰</text>
  <text x="90" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#62626b">텍스트·이미지</text>
  <rect x="200" y="120" width="120" height="60" rx="10" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
  <text x="260" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1b1b1f">라우터</text>
  <text x="260" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#62626b">누구에게 보낼지 고름</text>
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="390" y="62" width="110" height="46" rx="8" fill="#ffffff" stroke="#c9c7bf" stroke-width="1.5"/>
    <text x="445" y="90" fill="#62626b">전문가 1</text>
    <rect x="390" y="122" width="110" height="46" rx="8" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="2"/>
    <text x="445" y="150" fill="#1b1b1f">전문가 2 (선택)</text>
    <rect x="390" y="182" width="110" height="46" rx="8" fill="#ffffff" stroke="#c9c7bf" stroke-width="1.5"/>
    <text x="445" y="210" fill="#62626b">전문가 3</text>
    <rect x="390" y="242" width="110" height="46" rx="8" fill="#ffffff" stroke="#c9c7bf" stroke-width="1.5"/>
    <text x="445" y="270" fill="#62626b">… 여러 명</text>
  </g>
  <rect x="560" y="120" width="130" height="60" rx="10" fill="#ffffff" stroke="#62626b" stroke-width="2"/>
  <text x="625" y="146" text-anchor="middle" font-family="sans-serif" font-size="15" fill="#1b1b1f">출력</text>
  <text x="625" y="166" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#62626b">다음 토큰</text>
  <g stroke="#62626b" stroke-width="2" fill="none">
    <line x1="150" y1="150" x2="200" y2="150"/>
    <line x1="320" y1="150" x2="390" y2="85"/>
    <line x1="320" y1="150" x2="390" y2="145" stroke="#1f8a5b" stroke-width="3"/>
    <line x1="320" y1="150" x2="390" y2="205"/>
    <line x1="320" y1="150" x2="390" y2="265"/>
    <line x1="500" y1="145" x2="560" y2="150" stroke="#1f8a5b" stroke-width="3"/>
  </g>
  <text x="360" y="296" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#62626b">보도에 따르면 전체 594B 중 토큰마다 17B 활성 (그림은 구조 설명용)</text>
</svg>
