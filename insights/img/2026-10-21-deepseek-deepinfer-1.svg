<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" role="img" aria-labelledby="t1">
  <title id="t1">모델과 추론 엔진 DeepInfer, 하드웨어의 관계와 이번에 공개되지 않은 부분</title>
  <style>
    .bg{fill:#ffffff}.h{fill:#1b1b1f;font:800 19px Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .tx{fill:#1b1b1f;font:700 15px Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .sm{fill:#62626b;font:500 13px Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .tw{fill:#ffffff;font:700 15px Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .box{fill:#e8eefe;stroke:#2f5bea;stroke-width:1.5}.main{fill:#2f5bea}.hw{fill:#e5f4ec;stroke:#1f8a5b;stroke-width:1.5}
    .miss{fill:#f7f6f2;stroke:#c2412d;stroke-width:1.5;stroke-dasharray:5 4}.mt{fill:#c2412d;font:700 14px Pretendard,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
    .ar{stroke:#62626b;stroke-width:2;fill:none}
    @media (prefers-color-scheme: dark){
      .bg{fill:#1a1b1f}.h,.tx{fill:#ececf0}.sm{fill:#9a9aa5}.tw{fill:#111214}
      .box{fill:#1f2640;stroke:#7c9cff}.main{fill:#7c9cff}.hw{fill:#16291f;stroke:#4cc38a}
      .miss{fill:#111214;stroke:#f0806c}.mt{fill:#f0806c}.ar{stroke:#9a9aa5}
    }
  </style>
  <defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#888"/></marker></defs>
  <rect class="bg" width="800" height="440"/>
  <text class="h" x="32" y="40">모델은 '레시피', 추론 엔진은 '주방 운영 방식'</text>
  <text class="sm" x="32" y="62">같은 레시피(모델 가중치)라도 주방을 어떻게 돌리느냐에 따라 속도와 비용이 크게 달라진다</text>

  <rect class="box" x="32" y="90" width="170" height="70" rx="10"/>
  <text class="tx" x="117" y="120" text-anchor="middle">모델 가중치</text>
  <text class="sm" x="117" y="142" text-anchor="middle">DeepSeek-V4.1-Flash</text>

  <rect class="main" x="250" y="82" width="300" height="190" rx="12"/>
  <text class="tw" x="400" y="110" text-anchor="middle">DeepInfer (이번에 공개)</text>
  <text class="tw" x="270" y="142">· 최적화 커널 (FlashMLA·DeepGEMM)</text>
  <text class="tw" x="270" y="168">· GPU 간 통신 (DeepEP)</text>
  <text class="tw" x="270" y="194">· 병렬 처리 (데이터·전문가 병렬)</text>
  <text class="tw" x="270" y="220">· 추측 디코딩 (초안 토큰 검증)</text>
  <text class="tw" x="270" y="246">· 비동기 스케줄러 · 구조화 출력</text>

  <rect class="box" x="598" y="90" width="170" height="70" rx="10"/>
  <text class="tx" x="683" y="120" text-anchor="middle">사용자 요청</text>
  <text class="sm" x="683" y="142" text-anchor="middle">질문 → 답변</text>

  <path class="ar" d="M202 125 H246" marker-end="url(#a1)"/>
  <path class="ar" d="M598 125 H554" marker-end="url(#a1)"/>

  <rect class="hw" x="250" y="300" width="140" height="56" rx="10"/>
  <text class="tx" x="320" y="324" text-anchor="middle">NVIDIA SM100</text>
  <text class="sm" x="320" y="344" text-anchor="middle">Blackwell 계열 GPU</text>
  <rect class="hw" x="410" y="300" width="140" height="56" rx="10"/>
  <text class="tx" x="480" y="324" text-anchor="middle">Huawei Ascend 950</text>
  <text class="sm" x="480" y="344" text-anchor="middle">NPU</text>
  <path class="ar" d="M400 272 V296" marker-end="url(#a1)"/>
  <text class="sm" x="250" y="380">지원 하드웨어는 두 가지뿐 (Hopper 등 이전 세대 미지원)</text>

  <rect class="miss" x="598" y="196" width="170" height="160" rx="10"/>
  <text class="mt" x="683" y="222" text-anchor="middle">이번엔 빠진 것</text>
  <text class="sm" x="612" y="252">· KV 캐시 시스템</text>
  <text class="sm" x="612" y="278">· 프리필/디코드 분리</text>
  <text class="sm" x="612" y="304">· 복제본 간 부하 분산</text>
  <text class="sm" x="612" y="330">→ 바로 API 서버로는 X</text>
  <text class="sm" x="32" y="420">DeepInfer README 내용을 바탕으로 다시 그림</text>
</svg>
