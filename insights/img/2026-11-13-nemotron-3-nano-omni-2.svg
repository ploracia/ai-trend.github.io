<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" role="img" aria-label="모델 파일을 받아 llama-server로 띄우고 내 PC의 앱이 요청하는 흐름">
  <title>로컬 실행 흐름도</title>
  <text x="360" y="28" text-anchor="middle" font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif" font-size="16" font-weight="700" fill="#1b1b1f">로컬 실행 3단계 (Unsloth 문서 기준 흐름)</text>
  <g font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif" font-size="15" fill="#1b1b1f" text-anchor="middle">
    <rect x="20" y="70" width="190" height="104" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="1.5"/>
    <text x="115" y="108" font-weight="700">① 모델 파일</text>
    <text x="115" y="134" font-size="13">GGUF, 4bit 약 24GB</text>
    <text x="115" y="156" font-size="13">(RAM 약 25GB 이상)</text>

    <rect x="265" y="70" width="190" height="104" rx="12" fill="#2f5bea"/>
    <text x="360" y="108" font-weight="700" fill="#ffffff">② llama-server</text>
    <text x="360" y="134" font-size="13" fill="#ffffff">-hf 옵션으로 받아 실행</text>
    <text x="360" y="156" font-size="13" fill="#ffffff">포트 8001에서 대기</text>

    <rect x="510" y="70" width="190" height="104" rx="12" fill="#e5f4ec" stroke="#1f8a5b" stroke-width="1.5"/>
    <text x="605" y="108" font-weight="700">③ 내 PC의 앱</text>
    <text x="605" y="134" font-size="13">같은 PC에서 요청</text>
    <text x="605" y="156" font-size="13">데이터가 밖으로 안 나감</text>
  </g>
  <g stroke="#62626b" stroke-width="1.6" fill="none">
    <path d="M212 122 L262 122"/>
    <path d="M457 122 L507 122"/>
  </g>
  <g fill="#62626b">
    <path d="M257 117 L264 122 L257 127 Z"/>
    <path d="M502 117 L509 122 L502 127 Z"/>
  </g>
  <text x="360" y="222" text-anchor="middle" font-family="Pretendard, -apple-system, 'Malgun Gothic', sans-serif" font-size="13" fill="#62626b">8bit 버전은 RAM 약 36GB가 필요하다고 문서에 나와 있다</text>
</svg>
