<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 280" role="img" aria-label="모델이 만든 코드가 실행 전에 샌드박스와 승인 단계를 거치는 구조">
  <defs>
    <marker id="arr2" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#62626b"/>
    </marker>
  </defs>
  <rect width="760" height="280" fill="#f7f6f2" rx="12"/>
  <text x="380" y="34" text-anchor="middle" font-size="16" font-weight="700" fill="#1b1b1f" font-family="sans-serif">만든 플러그인은 바로 믿지 않고 한 번 거른다</text>

  <g font-family="sans-serif" font-size="14" fill="#1b1b1f">
    <rect x="20" y="80" width="170" height="100" rx="12" fill="#e8eefe" stroke="#2f5bea" stroke-width="2"/>
    <text x="105" y="115" text-anchor="middle" font-weight="700">모델이 생성</text>
    <text x="105" y="138" text-anchor="middle">코드와 명령</text>
    <text x="105" y="158" text-anchor="middle">(사람이 직접 쓰지 않음)</text>

    <rect x="240" y="80" width="170" height="100" rx="12" fill="#fff4e0" stroke="#b36b00" stroke-width="2"/>
    <text x="325" y="115" text-anchor="middle" font-weight="700">샌드박스 · 승인</text>
    <text x="325" y="138" text-anchor="middle">격리 환경에서 실행</text>
    <text x="325" y="158" text-anchor="middle">권한은 사용자가 허용</text>

    <rect x="460" y="80" width="280" height="100" rx="12" fill="#fbeae6" stroke="#c2412d" stroke-width="2"/>
    <text x="600" y="115" text-anchor="middle" font-weight="700">허용된 범위만 접근</text>
    <text x="600" y="138" text-anchor="middle">네트워크, 파일, 인증 정보</text>
    <text x="600" y="158" text-anchor="middle">격리가 완벽하다는 보장은 없음</text>
  </g>

  <g stroke="#62626b" stroke-width="2" fill="none" marker-end="url(#arr2)">
    <line x1="192" y1="130" x2="236" y2="130"/>
    <line x1="412" y1="130" x2="456" y2="130"/>
  </g>

  <text x="380" y="222" text-anchor="middle" font-size="13" fill="#62626b" font-family="sans-serif">Harness는 개발자 프리뷰 단계이며 보안 감사를 거치지 않았다고 보도되었다</text>
  <text x="380" y="244" text-anchor="middle" font-size="13" fill="#62626b" font-family="sans-serif">출처: 아래 참고한 글의 보도 내용을 바탕으로 다시 그림</text>
</svg>
